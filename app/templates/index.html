<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Smart Real Estate Price Predictor</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #101827, #243b55);
            color: white;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 25px;
        }

        .container {
            width: 100%;
            max-width: 520px;
            background: #ffffff;
            color: #1e293b;
            padding: 35px;
            border-radius: 18px;
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.3);
        }

        h1 {
            text-align: center;
            font-size: 27px;
            margin-bottom: 10px;
        }

        .subtitle {
            text-align: center;
            color: #64748b;
            margin-bottom: 28px;
            line-height: 1.5;
        }

        label {
            display: block;
            font-weight: bold;
            margin-bottom: 8px;
            margin-top: 18px;
        }

        input {
            width: 100%;
            padding: 13px;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            font-size: 15px;
            outline: none;
        }

        input:focus {
            border-color: #2563eb;
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.12);
        }

        button {
            width: 100%;
            margin-top: 25px;
            padding: 14px;
            border: none;
            border-radius: 8px;
            background: #2563eb;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background: #1d4ed8;
        }

        .result {
            margin-top: 25px;
            padding: 18px;
            border-radius: 10px;
            background: #dcfce7;
            color: #166534;
            text-align: center;
        }

        .result h2 {
            margin-top: 8px;
            font-size: 27px;
        }

        .error {
            margin-top: 20px;
            padding: 12px;
            background: #fee2e2;
            color: #b91c1c;
            border-radius: 8px;
        }

        .footer {
            margin-top: 25px;
            text-align: center;
            font-size: 12px;
            color: #64748b;
        }
    </style>
</head>

<body>
    <div class="container">

        <h1>🏡 Smart Real Estate</h1>

        <p class="subtitle">
            Predict Bengaluru property prices using Machine Learning.
        </p>

        <form method="POST">

            <label for="location">Property Location</label>
            <input
                type="text"
                id="location"
                name="location"
                placeholder="e.g. Whitefield"
                required
            >

            <label for="total_sqft">Area (Square Feet)</label>
            <input
                type="number"
                id="total_sqft"
                name="total_sqft"
                min="1"
                step="any"
                placeholder="e.g. 1200"
                required
            >

            <label for="bhk">Bedrooms (BHK)</label>
            <input
                type="number"
                id="bhk"
                name="bhk"
                min="1"
                step="1"
                placeholder="e.g. 2"
                required
            >

            <label for="bath">Bathrooms</label>
            <input
                type="number"
                id="bath"
                name="bath"
                min="1"
                step="1"
                placeholder="e.g. 2"
                required
            >

            <button type="submit">Predict Property Price</button>

        </form>

        {% if prediction %}
        <div class="result">
            <p>Estimated Property Price</p>
            <h2>{{ prediction }}</h2>
            <p>Model-based estimate, not a guaranteed market price.</p>
        </div>
        {% endif %}

        {% if error %}
        <div class="error">
            {{ error }}
        </div>
        {% endif %}

        <div class="footer">
            Built with Python, Flask & Machine Learning
        </div>

    </div>
</body>
</html>
